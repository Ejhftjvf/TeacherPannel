<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5FAFF;
            --card-bg: #FFFFFF;
            --text-color: #1E3A8A;
            --accent-color: #3B82F6;
            --btn-bg: #3B82F6;
            --btn-hover: #1E40AF;
            --border-color: rgba(59, 130, 246, 0.2);
            --shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            --notification-success-bg: #10B981;
            --notification-error-bg: #EF4444;
            --border-radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
        }

        .dashboard {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .mobile-header {
            display: none;
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .hamburger {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .sidebar {
            width: 220px;
            background: var(--card-bg);
            padding: 16px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 16px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .sidebar button {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .sidebar button.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .sidebar button:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .settings-btn, .logout-btn {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .logout-btn {
            border-color: var(--notification-error-bg);
            color: var(--notification-error-bg);
        }

        .logout-btn:hover {
            background: var(--notification-error-bg);
            color: #fff;
        }

        .settings-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            padding: 16px;
            margin-left: 220px;
        }

        .header {
            padding: 16px 0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }

        .overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.15);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .card p {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-color);
        }

        .data-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .data-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background: var(--accent-color);
            color: #fff;
            font-weight: 500;
        }

        td {
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover td {
            background: #DBEAFE;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        .action-btn:hover {
            background: var(--btn-hover);
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            align-self bipartisan: flex-end;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
                border-right: none;
                box-shadow: var(--shadow);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding-top: 60px;
            }

            .overview {
                grid-template-columns: 1fr;
            }

            table {
                overflow-x: auto;
                display: block;
            }

            th, td {
                padding: 8px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .data-section {
                padding: 12px;
            }

            .data-section h2 {
                font-size: 16px;
            }

            .action-btn {
                min-width: 100%;
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <header class="mobile-header">
        <h1>Teacher Dashboard</h1>
        <button class="hamburger" aria-label="Toggle menu">☰</button>
    </header>
    <aside class="sidebar">
        <button class="close-sidebar">×</button>
        <h2>Teacher Portal</h2>
        <nav>
            <button class="active" title="Home" onclick="window.location.href='index.html'">🏠 Dashboard</button>
            <button title="Student Management" onclick="window.location.href='s_add.html'">🎓 Students</button>
            <button title="Attendance Record" onclick="window.location.href='t_attendance.html'">📅 Attendance</button>
            <button title="File Manager" onclick="window.location.href='t_file.html'">📁 Profile</button>
            <button title="Marks Management" onclick="window.location.href='t_marks.html'">📊 Sessional</button>
        </nav>

        <button class="logout-btn" title="Logout" id="logoutBtn">🚪 Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Dashboard</h1>
        </header>
        <section class="overview">
            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>
            <div class="card">
                <h3>Classes Today</h3>
                <p id="classesToday">0</p>
            </div>
            <div class="card">
                <h3>Average Attendance</h3>
                <p id="avgAttendance">0%</p>
            </div>
        </section>
        <section class="data-section">
            <h2>Recent Activities</h2>
            <table id="activityTable">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Action</th>
                    <th>Details</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
        <section class="data-section">
            <h2>Quick Actions</h2>
            <div class="quick-actions">
                <button class="action-btn" onclick="window.location.href='teacher.html'">Record Attendance</button>
                <button class="action-btn" onclick="window.location.href='t_marks.html'">Upload Marks</button>
                <button class="5action-btn" onclick="window.location.href='add_student.html'">Add Student</button>
            </div>
        </section>
        <div id="status"></div>
    </main>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBzguLoHs-7yrbSal8IBDqnKL8MWwlUJZA",
        authDomain: "tmcp-a366e.firebaseapp.com",
        databaseURL: "https://tmcp-a366e-default-rtdb.firebaseio.com",
        projectId: "tmcp-a366e",
        storageBucket: "tmcp-a366e.firebasestorage.app",
        messagingSenderId: "136159734708",
        appId: "1:136159734708:web:5f33b5cd7535c09227e0e1"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        console.log("Firebase initialized successfully");

        // Sidebar toggle
        const hamburger = document.querySelector('.hamburger');
        const sidebar = document.querySelector('.sidebar');
        const closeSidebar = document.querySelector('.close-sidebar');

        hamburger?.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        closeSidebar?.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = 't_login.html';
            }).catch((error) => {
                console.error('Logout error:', error);
                document.getElementById('status').textContent = 'Logout failed: ' + error.message;
                document.getState('status').style.color = 'var(--notification-error-bg)';
            });
        });

        // Authentication check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 't_login.html';
                return;
            }
            loadDashboardData();
        });

        async function loadDashboardData() {
            const status = document.getElementById('status');
            try {
                // Fetch total students
                const studentsRef = ref(database, 'students');
                const studentsSnapshot = await get(studentsRef);
                const students = studentsSnapshot.val();
                const totalStudents = students ? Object.keys(students).length : 0;
                document.getElementById('totalStudents').textContent = totalStudents;

                // Mock data for classes today and average attendance
                document.getElementById('classesToday').textContent = '3';
                document.getElementById('avgAttendance').textContent = '85%';

                // Mock recent activities
                const activities = [
                    { date: '2025-05-01', action: 'Attendance Recorded', details: 'Semester 3, DBMS' },
                    { date: '2025-04-30', action: 'Marks Uploaded', details: 'Semester 4, OOPS, Sessional 2' },
                    { date: '2025-04-29', action: 'Student Added', details: 'John Doe, Roll No: 12345' }
                ];

                const activityTableBody = document.querySelector('#activityTable tbody');
                activityTableBody.innerHTML = '';
                activities.forEach(activity => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${activity.date}</td>
                        <td>${activity.action}</td>
                        <td>${activity.details}</td>
                    `;
                    activityTableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                status.textContent = 'Error loading data: ' + error.message;
                status.style.color = 'var(--notification-error-bg)';
            }
        }
    } catch (error) {
        console.error('Firebase initialization error:', error);
        document.getElementById('status').textContent = 'Failed to initialize Firebase. Please try again later.';
        document.getElementById('status').style.color = 'var(--notification-error-bg)';
    }
</script>
</body>
</html>
