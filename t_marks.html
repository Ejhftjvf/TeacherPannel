<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Upload Sessional Marks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5FAFF;
            --card-bg: #FFFFFF;
            --text-color: #1E3A8A;
            --accent-color: #3B82F6;
            --btn-bg: #3B82F6;
            --btn-hover: #1E40AF;
            --border-color: rgba(59, 130, 246, 0.2);
            --shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            --notification-success-bg: #10B981;
            --notification-error-bg: #EF4444;
            --border-radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
        }

        .dashboard {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .mobile-header {
            display: none;
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .hamburger {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .sidebar {
            width: 220px;
            background: var(--card-bg);
            padding: 16px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 16px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .sidebar button {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .sidebar button.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .sidebar button:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .settings-btn, .logout-btn {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .logout-btn {
            border-color: var(--notification-error-bg);
            color: var(--notification-error-bg);
        }

        .logout-btn:hover {
            background: var(--notification-error-bg);
            color: #fff;
        }

        .settings-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            padding: 16px;
            margin-left: 220px;
        }

        .header {
            padding: 16px 0;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }

        .data-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .data-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-bar select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            width: 180px;
            transition: var(--transition);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background: var(--accent-color);
            color: #fff;
            font-weight: 500;
        }

        td {
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover td {
            background: #DBEAFE;
        }

        .marks-input {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            width: 80px;
            text-align: center;
            transition: var(--transition);
        }

        .marks-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .marks-input:invalid {
            border-color: var(--notification-error-bg);
        }

        .form-btn {
            padding: 12px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
            width: 100%;
        }

        .form-btn:hover {
            background: var(--btn-hover);
        }

        .form-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #marksStatus {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
                border-right: none;
                box-shadow: var(--shadow);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding-top: 60px;
            }

            .filter-bar {
                flex-direction: column;
            }

            .filter-bar select {
                width: 100%;
            }

            table {
                overflow-x: auto;
                display: block;
            }

            th, td {
                padding: 8px;
                font-size: 13px;
            }

            .marks-input {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .data-section {
                padding: 12px;
            }

            .data-section h2 {
                font-size: 16px;
            }

            .form-btn {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <header class="mobile-header">
        <h1>Upload Sessional Marks</h1>
        <button class="hamburger" aria-label="Toggle menu">☰</button>
    </header>
    <aside class="sidebar">
        <button class="close-sidebar">×</button>
        <h2>Teacher Portal</h2>
        <nav>
            <button title="Home" onclick="window.location.href='index.html'">🏠 Dashboard</button>
            <button title="Student Management" onclick="window.location.href='s_add.html'">🎓 Students</button>
            <button title="Attendance Record" onclick="window.location.href='t_attendance.html'">📅 Attendance</button>
            <button title="File Manager" onclick="window.location.href='t_file.html'">📁 Profile</button>
            <button class="active" title="Marks Management" onclick="window.location.href='t_marks.html'">📊 Sessional</button>
        </nav>

        <button class="logout-btn" title="Logout" id="logoutBtn">🚪 Logout</button>
    </aside>

    <main class="main-content">
        <section id="marksSection" class="data-section">
            <h2>Upload Sessional Marks</h2>
            <div class="filter-bar">
                <select id="marksSemester" required>
                    <option value="">Select Semester</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <select id="marksSubject" required disabled>
                    <option value="">Select Subject</option>
                </select>
                <select id="marksSessional" required>
                    <option value="">Select Sessional</option>
                    <option value="sessional1">Sessional 1</option>
                    <option value="sessional2">Sessional 2</option>
                    <option value="sessional3">Sessional 3</option>
                </select>
            </div>
            <table id="marksTable">
                <thead>
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Marks</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="saveMarksBtn" class="form-btn save-btn" disabled>Save Marks</button>
            <div id="marksStatus"></div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
    import { getDatabase, ref, get, update } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBzguLoHs-7yrbSal8IBDqnKL8MWwlUJZA",
        authDomain: "tmcp-a366e.firebaseapp.com",
        databaseURL: "https://tmcp-a366e-default-rtdb.firebaseio.com",
        projectId: "tmcp-a366e",
        storageBucket: "tmcp-a366e.firebasestorage.app",
        messagingSenderId: "136159734708",
        appId: "1:136159734708:web:5f33b5cd7535c09227e0e1"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        console.log("Firebase initialized successfully");

        // Sidebar toggle
        const hamburger = document.querySelector('.hamburger');
        const sidebar = document.querySelector('.sidebar');
        const closeSidebar = document.querySelector('.close-sidebar');

        hamburger?.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        closeSidebar?.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });

        // Logout
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    console.log('Logout button clicked');
                    signOut(auth).then(() => {
                        window.location.href = 't_login.html';
                    }).catch((error) => {
                        console.error('Logout error:', error);
                        const statusElement = document.getElementById('marksStatus');
                        statusElement.textContent = `Logout failed: ${error.message}. Please try again.`;
                        statusElement.style.color = 'var(--notification-error-bg)';
                        if (error.code === 'auth/network-request-failed') {
                            setTimeout(() => signOut(auth).then(() => window.location.href = 't_login.html'), 2000);
                        }
                    });
                });
            } else {
                console.error('Logout button not found');
            }
        });

        // Authentication check
        onAuthStateChanged(auth, (user) => {
            console.log('Auth state changed:', user ? 'User logged in' : 'No user');
            if (!user) {
                window.location.href = 't_login.html';
                return;
            }
            loadTeacherMarksData();
        });

        const semesterSubjects = {
            '1': ['English', 'Applied Maths 1', 'Applied Physics 1', 'FIT'],
            '2': ['AIT', 'Applied Maths 2', 'Applied Physics 2', 'AE', 'EG', 'MMA', 'EVS'],
            '3': ['OS', 'PIC', 'DBMS', 'DE'],
            '4': ['English 2', 'COA', 'DS', 'OOPS', 'MOOCS'],
            '5': ['WT', 'Python', 'CN', 'Cloud', 'MOOCS'],
            '6': ['NS', 'SE', 'EDM']
        };

        function loadTeacherMarksData() {
            const marksSemester = document.getElementById('marksSemester');
            const marksSubject = document.getElementById('marksSubject');
            const marksSessional = document.getElementById('marksSessional');
            const saveBtn = document.getElementById('saveMarksBtn');
            const marksTableBody = document.querySelector('#marksTable tbody');

            // Update subjects when semester changes
            marksSemester.addEventListener('change', () => {
                const semester = marksSemester.value;
                marksSubject.innerHTML = '<option value="">Select Subject</option>';
                marksTableBody.innerHTML = '';
                saveBtn.disabled = true;

                if (semester) {
                    const subjects = semesterSubjects[semester] || [];
                    subjects.forEach(subject => {
                        const option = document.createElement('option');
                        option.value = subject;
                        option.textContent = subject;
                        marksSubject.appendChild(option);
                    });
                    marksSubject.disabled = false;
                } else {
                    marksSubject.disabled = true;
                }

                if (semester) {
                    loadStudents(semester);
                }
            });

            // Enable Save button when all fields are filled
            function checkFormComplete() {
                saveBtn.disabled = !(marksSemester.value && marksSubject.value && marksSessional.value && marksTableBody.children.length > 0);
            }

            marksSemester.addEventListener('change', checkFormComplete);
            marksSubject.addEventListener('change', checkFormComplete);
            marksSessional.addEventListener('change', checkFormComplete);
        }

        async function loadStudents(selectedSemester) {
            try {
                const studentsRef = ref(database, 'students');
                const snapshot = await get(studentsRef);
                const students = snapshot.val();
                const marksTableBody = document.querySelector('#marksTable tbody');

                marksTableBody.innerHTML = '';

                if (students) {
                    let hasStudents = false;
                    Object.keys(students).forEach(rollNo => {
                        const student = students[rollNo];
                        if (student.semester === selectedSemester) {
                            hasStudents = true;
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${rollNo}</td>
                                <td>${student.name}</td>
                                <td>
                                    <input type="number" class="marks-input" data-rollno="${rollNo}" min="0" max="100" placeholder="0-100">
                                </td>
                            `;
                            marksTableBody.appendChild(row);
                        }
                    });

                    if (!hasStudents) {
                        marksTableBody.innerHTML = '<tr><td colspan="3">No students found for this semester.</td></tr>';
                    } else {
                        // Trigger form check after loading students
                        document.getElementById('marksSessional').dispatchEvent(new Event('change'));
                    }
                } else {
                    throw new Error('No students found');
                }
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('marksStatus').textContent = 'Error loading students: ' + error.message;
                document.getElementById('marksStatus').style.color = 'var(--notification-error-bg)';
            }
        }

        document.getElementById('saveMarksBtn').addEventListener('click', async () => {
            const semester = document.getElementById('marksSemester').value;
            const subject = document.getElementById('marksSubject').value;
            const sessional = document.getElementById('marksSessional').value;
            const marksStatus = document.getElementById('marksStatus');

            if (!semester) {
                marksStatus.textContent = 'Please select a semester.';
                marksStatus.style.color = 'var(--notification-error-bg)';
                return;
            }

            if (!subject) {
                marksStatus.textContent = 'Please select a subject.';
                marksStatus.style.color = 'var(--notification-error-bg)';
                return;
            }

            if (!sessional) {
                marksStatus.textContent = 'Please select a sessional.';
                marksStatus.style.color = 'var(--notification-error-bg)';
                return;
            }

            try {
                const marksData = {};
                let hasMarks = false;

                document.querySelectorAll('.marks-input').forEach(input => {
                    const rollNo = input.dataset.rollno;
                    const marks = input.value.trim();

                    if (marks !== '') {
                        const markValue = parseInt(marks, 10);
                        if (isNaN(markValue) || markValue < 0 || markValue > 100) {
                            throw new Error(`Invalid marks for ${rollNo}: ${marks}. Must be 0-100.`);
                        }
                        hasMarks = true;
                        marksData[`sessional_marks/${rollNo}/${semester}/${subject}/${sessional}`] = markValue;
                    }
                });

                if (!hasMarks) {
                    marksStatus.textContent = 'Please enter at least one mark.';
                    marksStatus.style.color = 'var(--notification-error-bg)';
                    return;
                }

                // Batch update marks
                await update(ref(database), marksData);

                marksStatus.textContent = 'Marks saved successfully.';
                marksStatus.style.color = 'var(--notification-success-bg)';
                document.getElementById('saveMarksBtn').disabled = true;
            } catch (error) {
                console.error('Error saving marks:', error);
                marksStatus.textContent = 'Error saving marks: ' + error.message;
                marksStatus.style.color = 'var(--notification-error-bg)';
            }
        });
    } catch (error) {
        console.error('Firebase initialization error:', error);
        document.getElementById('marksStatus').textContent = 'Failed to initialize Firebase. Please try again later.';
        document.getElementById('marksStatus').style.color = 'var(--notification-error-bg)';
    }
</script>
</body>
</html>
