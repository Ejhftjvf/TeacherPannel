<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5FAFF;
            --card-bg: #FFFFFF;
            --text-color: #1E3A8A;
            --accent-color: #3B82F6;
            --btn-bg: #3B82F6;
            --btn-hover: #1E40AF;
            --border-color: rgba(59, 130, 246, 0.2);
            --shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            --notification-success-bg: #10B981;
            --notification-error-bg: #EF4444;
            --border-radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
        }

        .dashboard {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .mobile-header {
            display: none;
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .hamburger {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .sidebar {
            width: 220px;
            background: var(--card-bg);
            padding: 16px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 16px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .sidebar button {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .sidebar button.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .sidebar button:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .settings-btn, .logout-btn {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .logout-btn {
            border-color: var(--notification-error-bg);
            color: var(--notification-error-bg);
        }

        .logout-btn:hover {
            background: var(--notification-error-bg);
            color: #fff;
        }

        .settings-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            padding: 16px;
            margin-left: 220px;
        }

        .header {
            padding: 16px 0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }

        .profile-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid var(--border-color);
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .profile-details {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .profile-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-item label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
        }

        .profile-item span {
            font-size: 14px;
            color: var(--text-color);
        }

        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(30, 58, 138, 0.5);
        }

        .form-btn {
            padding: 12px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .form-btn:hover {
            background: var(--btn-hover);
        }

        .form-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
                border-right: none;
                box-shadow: var(--shadow);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding-top: 60px;
            }

            .profile-section {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .profile-section h2 {
                font-size: 16px;
            }

            .profile-item label, .profile-item span {
                font-size: 13px;
            }

            .form-group input, .form-group select, .form-btn {
                font-size: 13px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <header class="mobile-header">
        <h1>Teacher Profile</h1>
        <button class="hamburger" aria-label="Toggle menu">☰</button>
    </header>
    <aside class="sidebar">
        <button class="close-sidebar">×</button>
        <h2>Teacher Portal</h2>
        <nav>
            <button title="Home" onclick="window.location.href='index.html'">🏠 Dashboard</button>
            <button title="Student Management" onclick="window.location.href='s_add.html'">🎓 Students</button>
            <button title="Attendance Record" onclick="window.location.href='t_attendance.html'">📅 Attendance</button>
            <button class="active" title="File Manager" onclick="window.location.href='t_file.html'">📁 Profile</button>
            <button title="Marks Management" onclick="window.location.href='t_marks.html'">📊 Sessional</button>
        </nav>

        <button class="logout-btn" title="Logout" id="logoutBtn">🚪 Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Profile</h1>
        </header>
        <section class="profile-section">
            <h2>Your Profile</h2>
            <div class="profile-details">
                <div class="profile-item">
                    <label>Full Name</label>
                    <span id="profileName">Loading...</span>
                </div>
                <div class="profile-item">
                    <label>Email</label>
                    <span id="profileEmail">Loading...</span>
                </div>
                <div class="profile-item">
                    <label>Phone</label>
                    <span id="profilePhone">Not set</span>
                </div>
                <div class="profile-item">
                    <label>Department</label>
                    <span id="profileDepartment">Not set</span>
                </div>
            </div>
            <h2>Update Profile</h2>
            <form id="profileForm" class="profile-form">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Physics">Physics</option>
                        <option value="English">English</option>
                        <option value="Engineering">Engineering</option>
                    </select>
                </div>
                <button type="submit" class="form-btn">Update Profile</button>
            </form>
            <div id="status"></div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
    import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBzguLoHs-7yrbSal8IBDqnKL8MWwlUJZA",
        authDomain: "tmcp-a366e.firebaseapp.com",
        databaseURL: "https://tmcp-a366e-default-rtdb.firebaseio.com",
        projectId: "tmcp-a366e",
        storageBucket: "tmcp-a366e.firebasestorage.app",
        messagingSenderId: "136159734708",
        appId: "1:136159734708:web:5f33b5cd7535c09227e0e1"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        console.log("Firebase initialized successfully");

        // Sidebar toggle
        const hamburger = document.querySelector('.hamburger');
        const sidebar = document.querySelector('.sidebar');
        const closeSidebar = document.querySelector('.close-sidebar');

        hamburger?.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        closeSidebar?.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });

        // Logout
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    console.log('Logout button clicked');
                    signOut(auth).then(() => {
                        window.location.href = 't_login.html';
                    }).catch((error) => {
                        console.error('Logout error:', error);
                        const statusElement = document.getElementById('status');
                        statusElement.textContent = `Logout failed: ${error.message}. Please try again.`;
                        statusElement.style.color = 'var(--notification-error-bg)';
                        if (error.code === 'auth/network-request-failed') {
                            setTimeout(() => signOut(auth).then(() => window.location.href = 't_login.html'), 2000);
                        }
                    });
                });
            } else {
                console.error('Logout button not found');
            }
        });

        // Authentication check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 't_login.html';
                return;
            }
            loadProfileData(user);
        });

        async function loadProfileData(user) {
            const status = document.getElementById('status');
            try {
                const teacherRef = ref(database, `teachers/${user.uid}`);
                const snapshot = await get(teacherRef);
                const teacherData = snapshot.val() || {};

                // Display profile data
                document.getElementById('profileName').textContent = teacherData.name || 'Not set';
                document.getElementById('profileEmail').textContent = user.email || 'Not set';
                document.getElementById('profilePhone').textContent = teacherData.phone || 'Not set';
                document.getElementById('profileDepartment').textContent = teacherData.department || 'Not set';

                // Pre-fill form
                document.getElementById('phone').value = teacherData.phone || '';
                document.getElementById('department').value = teacherData.department || '';
            } catch (error) {
                console.error('Error loading profile data:', error);
                status.textContent = 'Error loading profile: ' + error.message;
                status.style.color = 'var(--notification-error-bg)';
            }
        }

        // Handle profile update
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const department = document.getElementById('department').value;
            const status = document.getElementById('status');
            const user = auth.currentUser;

            if (!user) {
                status.textContent = 'Please log in to update your profile.';
                status.style.color = 'var(--notification-error-bg)';
                return;
            }

            // Validate phone (basic regex for 10-digit numbers)
            const phoneRegex = /^\d{10}$/;
            if (phone && !phoneRegex.test(phone)) {
                status.textContent = 'Please enter a valid 10-digit phone number.';
                status.style.color = 'var(--notification-error-bg)';
                return;
            }

            try {
                const updates = {};
                if (phone) updates.phone = phone;
                if (department) updates.department = department;

                if (Object.keys(updates).length === 0) {
                    status.textContent = 'No changes to update.';
                    status.style.color = 'var(--notification-error-bg)';
                    return;
                }

                await set(ref(database, `teachers/${user.uid}`), {
                    name: document.getElementById('profileName').textContent,
                    email: user.email,
                    ...updates
                });

                // Update displayed data
                if (phone) document.getElementById('profilePhone').textContent = phone;
                if (department) document.getElementById('profileDepartment').textContent = department;

                status.textContent = 'Profile updated successfully!';
                status.style.color = 'var(--notification-success-bg)';
            } catch (error) {
                console.error('Error updating profile:', error);
                status.textContent = 'Error updating profile: ' + error.message;
                status.style.color = 'var(--notification-error-bg)';
            }
        });
    } catch (error) {
        console.error('Firebase initialization error:', error);
        document.getElementById('status').textContent = 'Failed to initialize Firebase. Please try again later.';
        document.getElementById('status').style.color = 'var(--notification-error-bg)';
    }
</script>
</body>
</html>
