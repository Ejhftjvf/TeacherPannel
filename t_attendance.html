<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5FAFF;
            --card-bg: #FFFFFF;
            --text-color: #1E3A8A;
            --accent-color: #3B82F6;
            --btn-bg: #3B82F6;
            --btn-hover: #1E40AF;
            --border-color: rgba(59, 130, 246, 0.2);
            --shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            --notification-success-bg: #10B981;
            --notification-error-bg: #EF4444;
            --border-radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            min-height: 100vh;
        }

        .dashboard {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .mobile-header {
            display: none;
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .hamburger {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .sidebar {
            width: 220px;
            background: var(--card-bg);
            padding: 16px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            transition: transform 0.3s ease;
            z-index: 999;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 16px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .sidebar button {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .sidebar button.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .sidebar button:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .settings-btn, .logout-btn {
            padding: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .logout-btn {
            border-color: var(--notification-error-bg);
            color: var(--notification-error-bg);
        }

        .logout-btn:hover {
            background: var(--notification-error-bg);
            color: #fff;
        }

        .settings-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .main-content {
            flex: 1;
            padding: 16px;
            margin-left: 220px;
        }

        .header {
            padding: 16px 0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-color);
        }

        .data-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .data-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-bar select, .filter-bar input[type="date"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            width: 180px;
            transition: var(--transition);
        }

        .filter-bar select:focus, .filter-bar input[type="date"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background: var(--accent-color);
            color: #fff;
            font-weight: 500;
        }

        td {
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover td {
            background: #DBEAFE;
        }

        .attendance-select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            width: 120px;
        }

        .form-btn {
            padding: 12px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }

        .form-btn:hover {
            background: var(--btn-hover);
        }

        .form-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #attendanceStatus {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
                border-right: none;
                box-shadow: var(--shadow);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .close-sidebar {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding-top: 60px;
            }

            .filter-bar {
                flex-direction: column;
            }

            .filter-bar select, .filter-bar input[type="date"] {
                width: 100%;
            }

            table {
                overflow-x: auto;
                display: block;
            }

            th, td {
                padding: 8px;
                font-size: 13px;
            }

            .attendance-select {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
            }

            .data-section h2 {
                font-size: 16px;
            }

            .form-btn {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <header class="mobile-header">
        <h1>Record Attendance</h1>
        <button class="hamburger" aria-label="Toggle menu">☰</button>
    </header>
    <aside class="sidebar">
        <button class="close-sidebar">×</button>
        <h2>Teacher Portal</h2>
        <nav>
            <button title="Home" onclick="window.location.href='index.html'">🏠 Dashboard</button>
            <button title="Student Management" onclick="window.location.href='s_add.html'">🎓 Students</button>
            <button class="active" title="Attendance Record" onclick="window.location.href='t_attendance.html'">📅 Attendance</button>
            <button title="File Manager" onclick="window.location.href='t_file.html'">📁 Profile</button>
            <button title="Marks Management" onclick="window.location.href='t_marks.html'">📊 Sessional</button>
        </nav>

        <button class="logout-btn" title="Logout" id="logoutBtn">🚪 Logout</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Record Attendance</h1>
        </header>
        <section id="attendanceSection" class="data-section">
            <h2>Record Attendance</h2>
            <div class="filter-bar">
                <select id="attendanceSemester" required>
                    <option value="">Select Semester</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <select id="attendanceClass" required disabled>
                    <option value="">Select Class</option>
                </select>
                <input type="date" id="attendanceDate" required>
            </div>
            <table id="attendanceTable">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll Number</th>
                    <th>Attendance Status</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="saveAttendanceBtn" class="form-btn save-btn" disabled>Save Attendance</button>
            <div id="attendanceStatus"></div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
    import { getDatabase, ref, get, set, update } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBzguLoHs-7yrbSal8IBDqnKL8MWwlUJZA",
        authDomain: "tmcp-a366e.firebaseapp.com",
        databaseURL: "https://tmcp-a366e-default-rtdb.firebaseio.com",
        projectId: "tmcp-a366e",
        storageBucket: "tmcp-a366e.firebasestorage.app",
        messagingSenderId: "136159734708",
        appId: "1:136159734708:web:5f33b5cd7535c09227e0e1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const semesterSubjects = {
        '1': ['English', 'Applied Maths 1', 'Applied Physics 1', 'FIT'],
        '2': ['AIT', 'Applied Maths 2', 'Applied Physics 2', 'AE', 'EG', 'MMA', 'EVS'],
        '3': ['OS', 'PIC', 'DBMS', 'DE'],
        '4': ['English 2', 'COA', 'DS', 'OOPS', 'MOOCS'],
        '5': ['WT', 'Python', 'CN', 'Cloud', 'MOOCS'],
        '6': ['NS', 'SE', 'EDM']
    };

    // Sidebar toggle
    const hamburger = document.querySelector('.hamburger');
    const sidebar = document.querySelector('.sidebar');
    const closeSidebar = document.querySelector('.close-sidebar');

    hamburger?.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });

    closeSidebar?.addEventListener('click', () => {
        sidebar.classList.remove('active');
    });

    // Logout
    document.addEventListener('DOMContentLoaded', () => {
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                console.log('Logout button clicked');
                signOut(auth).then(() => {
                    window.location.href = 't_login.html';
                }).catch((error) => {
                    console.error('Logout error:', error);
                    const statusElement = document.getElementById('attendanceStatus');
                    statusElement.textContent = `Logout failed: ${error.message}. Please try again.`;
                    statusElement.style.color = 'var(--notification-error-bg)';
                    if (error.code === 'auth/network-request-failed') {
                        setTimeout(() => signOut(auth).then(() => window.location.href = 't_login.html'), 2000);
                    }
                });
            });
        } else {
            console.error('Logout button not found');
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = 't_login.html';
            return;
        }
        loadTeacherData();
    });

    function loadTeacherData() {
        const attendanceSemester = document.getElementById('attendanceSemester');
        const attendanceClass = document.getElementById('attendanceClass');
        const attendanceDate = document.getElementById('attendanceDate');
        const saveBtn = document.getElementById('saveAttendanceBtn');
        const attendanceTableBody = document.querySelector('#attendanceTable tbody');

        // Function to update date in real-time
        const updateTodayDate = () => {
            const today = new Date().toISOString().split('T')[0];
            console.log(`Updating date to: ${today}`);
            attendanceDate.value = today;
            attendanceDate.max = today;
            attendanceDate.dispatchEvent(new Event('change'));
        };

        updateTodayDate();
        setInterval(updateTodayDate, 10000);

        attendanceSemester.addEventListener('change', () => {
            const semester = attendanceSemester.value;
            attendanceClass.innerHTML = '<option value="">Select Class</option>';
            attendanceTableBody.innerHTML = '';
            saveBtn.disabled = true;

            if (semester) {
                const subjects = semesterSubjects[semester] || [];
                subjects.forEach(subject => {
                    const option = document.createElement('option');
                    option.value = subject;
                    option.textContent = subject;
                    attendanceClass.appendChild(option);
                });
                attendanceClass.disabled = false;
                loadStudents(semester);
            } else {
                attendanceClass.disabled = true;
            }
        });

        function checkFormComplete() {
            saveBtn.disabled = !(attendanceSemester.value && attendanceClass.value && attendanceDate.value);
        }

        attendanceSemester.addEventListener('change', checkFormComplete);
        attendanceClass.addEventListener('change', checkFormComplete);
        attendanceDate.addEventListener('change', checkFormComplete);
    }

    async function loadStudents(selectedSemester) {
        try {
            const studentsRef = ref(database, 'students');
            const snapshot = await get(studentsRef);
            const students = snapshot.val();
            const attendanceTableBody = document.querySelector('#attendanceTable tbody');

            attendanceTableBody.innerHTML = '';

            if (students && selectedSemester) {
                let hasStudents = false;
                Object.keys(students).forEach(rollNo => {
                    const student = students[rollNo];
                    if (student.semester === selectedSemester) {
                        hasStudents = true;
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${student.name}</td>
                            <td>${rollNo}</td>
                            <td>
                                <select class="attendance-select" data-rollno="${rollNo}">
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                </select>
                            </td>
                        `;
                        attendanceTableBody.appendChild(row);
                    }
                });

                if (!hasStudents) {
                    attendanceTableBody.innerHTML = '<tr><td colspan="3">No students found for this semester.</td></tr>';
                }
            } else if (!selectedSemester) {
                attendanceTableBody.innerHTML = '<tr><td colspan="3">Please select a semester to view students.</td></tr>';
            } else {
                throw new Error('No students found');
            }
        } catch (error) {
            console.error('Error loading students:', error);
            document.getElementById('attendanceStatus').textContent = 'Error loading students: ' + error.message;
            document.getElementById('attendanceStatus').style.color = 'var(--notification-error-bg)';
        }
    }

    document.getElementById('saveAttendanceBtn').addEventListener('click', async () => {
        const semester = document.getElementById('attendanceSemester').value;
        const subject = document.getElementById('attendanceClass').value;
        const date = document.getElementById('attendanceDate').value;
        const attendanceStatus = document.getElementById('attendanceStatus');

        if (!semester) {
            attendanceStatus.textContent = 'Please select a semester.';
            attendanceStatus.style.color = 'var(--notification-error-bg)';
            return;
        }

        if (!subject) {
            attendanceStatus.textContent = 'Please select a class.';
            attendanceStatus.style.color = 'var(--notification-error-bg)';
            return;
        }

        if (!date) {
            attendanceStatus.textContent = 'Please select a date.';
            attendanceStatus.style.color = 'var(--notification-error-bg)';
            return;
        }

        const attendanceKey = `${date}_${subject}`;

        try {
            const attendanceData = {};
            const studentUpdates = {};

            document.querySelectorAll('.attendance-select').forEach(select => {
                const rollNo = select.dataset.rollno;
                const status = select.value;
                const row = select.closest('tr');
                const name = row.querySelector('td:first-child').textContent;

                attendanceData[rollNo] = {
                    name,
                    rollNo,
                    status
                };

                studentUpdates[`attendance/${rollNo}/${subject}`] = {
                    totalClasses: 0,
                    attendedClasses: 0
                };
            });

            for (const rollNo of Object.keys(attendanceData)) {
                const attendanceRef = ref(database, `attendance/${rollNo}/${subject}`);
                const snapshot = await get(attendanceRef);
                const currentData = snapshot.val() || { totalClasses: 0, attendedClasses: 0 };

                studentUpdates[`attendance/${rollNo}/${subject}`] = {
                    totalClasses: currentData.totalClasses + 1,
                    attendedClasses: currentData.attendedClasses + (attendanceData[rollNo].status === 'Present' ? 1 : 0)
                };
            }

            await set(ref(database, `teacher_attendance/${attendanceKey}`), attendanceData);
            await update(ref(database), studentUpdates);

            attendanceStatus.textContent = 'Attendance saved successfully.';
            attendanceStatus.style.color = 'var(--notification-success-bg)';
            document.getElementById('saveAttendanceBtn').disabled = true;
        } catch (error) {
            console.error('Error saving attendance:', error);
            attendanceStatus.textContent = 'Error saving attendance: ' + error.message;
            attendanceStatus.style.color = 'var(--notification-error-bg)';
        }
    });
</script>
</body>
</html>
