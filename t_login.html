<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login & Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5FAFF;        /* Light sky blue background */
            --card-bg: #FFFFFF;         /* Pure white card */
            --text-color: #1E3A8A;      /* Dark blue text */
            --accent-color: #3B82F6;    /* Sky blue accent */
            --btn-bg: #3B82F6;          /* Sky blue button */
            --btn-hover: #1E40AF;       /* Darker blue on hover */
            --border-color: rgba(59, 130, 246, 0.2);
            --shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            --notification-success-bg: #10B981; /* Green for success */
            --notification-error-bg: #EF4444;   /* Red for error */
            --border-radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-toggle {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-toggle button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 12px;
            transition: var(--transition);
        }

        .form-toggle button.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .form-toggle button:hover {
            color: var(--accent-color);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        input::placeholder {
            color: rgba(30, 58, 138, 0.5);
        }

        button[type="submit"] {
            padding: 12px;
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        button[type="submit"]:hover {
            background: var(--btn-hover);
        }

        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        #loginForm {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
                max-width: 90%;
            }

            h1 {
                font-size: 18px;
            }

            .form-toggle button {
                font-size: 13px;
                padding: 6px 10px;
            }

            input, button[type="submit"] {
                font-size: 13px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Teacher Portal</h1>
    <div class="form-toggle">
        <button id="loginToggle" class="active">Login</button>
        <button id="signupToggle">Signup</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="Enter your email">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="Enter your password">
        <button type="submit">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" required placeholder="Enter your full name">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required placeholder="Enter your email">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required placeholder="Enter your password (min 6 chars)">
        <button type="submit">Signup</button>
    </form>

    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
    import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBzguLoHs-7yrbSal8IBDqnKL8MWwlUJZA",
        authDomain: "tmcp-a366e.firebaseapp.com",
        databaseURL: "https://tmcp-a366e-default-rtdb.firebaseio.com",
        projectId: "tmcp-a366e",
        storageBucket: "tmcp-a366e.firebasestorage.app",
        messagingSenderId: "136159734708",
        appId: "1:136159734708:web:5f33b5cd7535c09227e0e1"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        console.log("Firebase initialized successfully");

        // Form elements
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginToggle = document.getElementById('loginToggle');
        const signupToggle = document.getElementById('signupToggle');
        const status = document.getElementById('status');

        // Toggle between login and signup forms
        loginToggle.addEventListener('click', () => {
            loginForm.style.display = 'flex';
            signupForm.style.display = 'none';
            loginToggle.classList.add('active');
            signupToggle.classList.remove('active');
            status.textContent = '';
        });

        signupToggle.addEventListener('click', () => {
            loginForm.style.display = 'none';
            signupForm.style.display = 'flex';
            loginToggle.classList.remove('active');
            signupToggle.classList.add('active');
            status.textContent = '';
        });

        // Default to login form
        loginForm.style.display = 'flex';
        signupForm.style.display = 'none';

        // Login form submission
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    status.textContent = 'Login successful! Redirecting...';
                    status.style.color = 'var(--notification-success-bg)';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                })
                .catch((error) => {
                    console.error("Login failed:", error);
                    status.textContent = `Login failed: ${error.message}`;
                    status.style.color = 'var(--notification-error-bg)';
                });
        });

        // Signup form submission
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // Store teacher data in 'teachers' collection
                    return set(ref(database, `teachers/${user.uid}`), {
                        name: name,
                        email: email,
                        createdAt: new Date().toISOString()
                    });
                })
                .then(() => {
                    status.textContent = 'Signup successful! Please login.';
                    status.style.color = 'var(--notification-success-bg)';
                    signupForm.reset();
                    loginToggle.click(); // Switch to login form
                })
                .catch((error) => {
                    console.error("Signup failed:", error);
                    status.textContent = `Signup failed: ${error.message}`;
                    status.style.color = 'var(--notification-error-bg)';
                });
        });

    } catch (error) {
        console.error("Firebase initialization error:", error);
        const status = document.getElementById('status');
        status.textContent = 'Failed to initialize Firebase. Please try again later.';
        status.style.color = 'var(--notification-error-bg)';
    }
</script>
</body>
</html>
